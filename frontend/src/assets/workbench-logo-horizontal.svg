<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Workbench Horizontal Brandmark (Symbol + Wordmark) -->
  <!-- Plain White Background with Generous Padding -->
  <rect width="320" height="80" fill="#FFFFFF"/>

  <!-- Symbol: Minimal Geometric Workbench (Front Elevation) -->
  <!-- Clean geometric reduction: flat horizontal top slab with two legs and structural shelf -->
  <g transform="translate(26, 22)">
    <!-- Top Horizontal Slab (Precision Work Surface in Deep Blue #2563EB) -->
    <rect x="2" y="3" width="32" height="5.5" rx="1.5" fill="#2563EB"/>
    <!-- Left Sturdy Pier Leg (Ink Navy #1E293B) -->
    <rect x="5.5" y="11.5" width="5" height="19.5" rx="1.5" fill="#1E293B"/>
    <!-- Right Sturdy Pier Leg (Ink Navy #1E293B) -->
    <rect x="25.5" y="11.5" width="5" height="19.5" rx="1.5" fill="#1E293B"/>
    <!-- Lower Structural Stretcher / Tool Shelf (Ink Navy #1E293B) -->
    <rect x="7.5" y="20.5" width="21" height="4" rx="1.2" fill="#1E293B"/>
  </g>

  <!-- Wordmark: "Workbench" in Inter SemiBold (600), -0.02em letter spacing -->
  <text x="78" y="47" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.02em" fill="#111827">Workbench</text>
</svg>
