<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Workbench Standalone Symbol (Square App Icon / Favicon) -->
  <!-- Plain White Background Canvas with Generous Padding -->
  <rect width="64" height="64" fill="#FFFFFF"/>

  <g transform="translate(14, 16)">
    <!-- Top Horizontal Slab (Precision Work Surface in Deep Blue #2563EB) -->
    <rect x="2" y="3" width="32" height="5.5" rx="1.5" fill="#2563EB"/>
    <!-- Left Sturdy Pier Leg (Ink Navy #1E293B) -->
    <rect x="5.5" y="11.5" width="5" height="19.5" rx="1.5" fill="#1E293B"/>
    <!-- Right Sturdy Pier Leg (Ink Navy #1E293B) -->
    <rect x="25.5" y="11.5" width="5" height="19.5" rx="1.5" fill="#1E293B"/>
    <!-- Lower Structural Stretcher / Tool Shelf (Ink Navy #1E293B) -->
    <rect x="7.5" y="20.5" width="21" height="4" rx="1.2" fill="#1E293B"/>
  </g>
</svg>
